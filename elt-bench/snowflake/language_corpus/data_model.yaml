models:
  - name: language_corpus__words
    description: Each record represents a word
    columns:
      - name: word_id
        description: The unique identifier of the word
      - name: word
        description: The word
      - name: occurrences
        description: The number of occurrences of the word
      - name: num_biword
        description: The number of biwords that contain the word, replace NULL values with 0.
      - name: percentage_occurrence_Art_higher_Astronomia
        description: The percentage difference in the word’s occurrence rate on the page titled “Art” relative to "Astronomia", calculated as (occurrences in Art - occurrences in Astronomia) / occurrences in Astronomia * 100. Leave NULL if the word does not appear on the page titled "Art" or "Astronomia".
      - name: same_word_appears_in_a_pair
        description: set to 1 if the word appears more than once in a pair, otherwise, set to 0. Appears in a pair refers to w1st is the same as w2nd in the biword table.
      - name: repetition_more_than_16000
        description: set to 1 if the word appears more than 16000 times, otherwise, set to 0
      - name: avg_occurrence_per_page
        description: the average occurrence of the word on each Wikipedia page that has this word. Replace NULL values with 0.
