aws_s3:
  AWS_ACCESS_KEY_ID: test
  AWS_DEFAULT_REGION: us-west-2
  AWS_ENDPOINT_URL: http://elt-localstack:4566
  AWS_SECRET_ACCESS_KEY: test
  data:
  - path: s3://movies-4-bucket/department.jsonl
    sync_mode: full_refresh_append
    table: department
  - path: s3://movies-4-bucket/genre.csv
    sync_mode: full_refresh_append
    table: genre
  - path: s3://movies-4-bucket/language.jsonl
    sync_mode: full_refresh_append
    table: language
custom_api:
  config:
    configuration: {}
    sync_mode: full_refresh_append
    tables:
    - keyword
    - movie_genres
    - movie_keywords
    - movie_languages
flat_files:
- format: jsonl
  path: https://drive.google.com/uc?export=download&id=15VKkeHY0IbG1uUvvY2GxG_Yxg_DspXTC
  sync_mode: full_refresh_append
  table: country
- format: jsonl
  path: https://drive.google.com/uc?export=download&id=1xgvOQVoHqk1Lzj81ZmbgC2mj1nkXlqnm
  sync_mode: full_refresh_append
  table: language_role
- format: csv
  path: https://drive.google.com/uc?export=download&id=172ilyK0v3x-xGwdBohmSVPDT0aDu8Iab
  sync_mode: full_refresh_append
  table: gender
mongodb:
  config:
    connection_string: mongodb://elt-mongodb:27017/?directConnection=true
    database: movies_4
    sync_mode: full_refresh_append
    tables:
    - movie
    - person
    - production_company
postgres:
  config:
    database: movies_4
    host: elt-postgres
    password: testelt
    port: 5432
    schema: public
    sync_mode: full_refresh_append
    tables:
    - movie_cast
    - movie_company
    - movie_crew
    - production_country
    user: postgres
databricks:
  config:
    database: <db_database>
    hostname: <db_hostname>
    client_id: <db_client_id>
    secret: <db_secret>
    schema: movies_4
    http_path: <db_path>
