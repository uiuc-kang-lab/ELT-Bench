models:
  - name: coinmarket__coins
    description: Each record represents a coin.
    columns:
      - name: coin_id
        description: Unique identifier for the coin.
      - name: coin_name
        description: Name of the coin.
      - name: coin_status
        description: Status of the coin.
      - name: highest_price
        description: Maximum value of highest price observed for the coin across all dates. Highest price refers to the high column in the source data.
      - name: date_lowest_price
        description: Date of the row with the smallest value in the low column for the coin, with ties broken by the ascending order of the date. Rows where low is NULL are ignored; NULL if the coin has no non-NULL low value.
      - name: is_above_average_20180428
        description: Set to 1 if the price of the coin on 2018-04-28 is above the average price of all coins on 2018-04-28; otherwise, set to 0.
      - name: average_price
        description: Average price of the coin.
      - name: date_with_greatest_price_decline
        description: Date of the row with the greatest price decline in the first hour for the coin, i.e. the smallest price percentage change in the first hour (even if it is not negative), with ties broken by the descending order of the date. Rows where this change is NULL are ignored; NULL if the coin has no such value.