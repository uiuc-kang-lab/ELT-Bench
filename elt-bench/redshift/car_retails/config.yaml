aws_s3:
  AWS_ACCESS_KEY_ID: test
  AWS_DEFAULT_REGION: us-west-2
  AWS_ENDPOINT_URL: http://elt-localstack:4566
  AWS_SECRET_ACCESS_KEY: test
  data:
  - path: s3://car-retails-bucket/offices.jsonl
    sync_mode: full_refresh_append
    table: offices
custom_api:
  config:
    configuration: {}
    sync_mode: full_refresh_append
    tables:
    - productlines
flat_files:
- format: jsonl
  path: https://drive.google.com/uc?export=download&id=162_-w6klN-f_oxR8I_4Kwz3XyaTTVIvM
  sync_mode: full_refresh_append
  table: employees
mongodb:
  config:
    connection_string: mongodb://elt-mongodb:27017/?directConnection=true
    database: car_retails
    sync_mode: full_refresh_append
    tables:
    - customers
    - products
postgres:
  config:
    database: car_retails
    host: elt-postgres
    password: testelt
    port: 5432
    schema: public
    sync_mode: full_refresh_append
    tables:
    - orderdetails
    - orders
    - payments
    user: postgres
redshift:
  config:
    host: <redshift_hostname>
    port: <redshift_port>
    database: <redshift_db>
    username: <redshift_username>
    password: <redshift_pwd>
    schema: car_retails
    s3_bucket_name: <redshift_s3_bucket>
    s3_bucket_region: <redshift_s3_region>
    access_key_id: <redshift_s3_access_key>
    secret_access_key: <redshift_s3_secret_key>
