aws_s3:
  AWS_ACCESS_KEY_ID: test
  AWS_DEFAULT_REGION: us-west-2
  AWS_ENDPOINT_URL: http://elt-localstack:4566
  AWS_SECRET_ACCESS_KEY: test
  data:
  - path: s3://regional-sales-bucket/Regions.jsonl
    sync_mode: full_refresh_append
    table: Regions
custom_api:
  config:
    configuration: {}
    sync_mode: full_refresh_append
    tables:
    - Products
flat_files:
- format: csv
  path: https://drive.google.com/uc?export=download&id=1zNo7paEsCdTqDP3cks7K8N3r1zdVNcgW
  sync_mode: full_refresh_append
  table: Store_Locations
mongodb:
  config:
    connection_string: mongodb://elt-mongodb:27017/?directConnection=true
    database: regional_sales
    sync_mode: full_refresh_append
    tables:
    - Customers
    - Sales_Team
postgres:
  config:
    database: regional_sales
    host: elt-postgres
    password: testelt
    port: 5432
    schema: public
    sync_mode: full_refresh_append
    tables:
    - sales_orders
    user: postgres
redshift:
  config:
    host: <redshift_hostname>
    port: <redshift_port>
    database: <redshift_db>
    username: <redshift_username>
    password: <redshift_pwd>
    schema: regional_sales
    s3_bucket_name: <redshift_s3_bucket>
    s3_bucket_region: <redshift_s3_region>
    access_key_id: <redshift_s3_access_key>
    secret_access_key: <redshift_s3_secret_key>
